name: go-fraud-pipeline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 2s
      timeout: 2s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X brokers=localhost:9092"]
      interval: 3s
      timeout: 3s
      retries: 30

  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create transactions.v1 fraud.assessments.v1 fraud.labels.v1 fraud.dead-letter.v1
        --partitions 6 -X brokers=redpanda:9092 || true
    restart: "no"

  fraud-service:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://fraud:fraud@postgres:5432/fraud?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      HTTP_ADDRESS: :8080
      MODEL_PATH: /app/configs/model.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redpanda-data:
